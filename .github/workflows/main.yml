
name: Build WeChatStyleDemo IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Check project configuration
        run: |
          test -f project.yml
          cat project.yml

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          ls -la WeChatStyleDemo.xcodeproj

      - name: Build iOS app
        run: |
          xcodebuild \
            -project WeChatStyleDemo.xcodeproj \
            -scheme WeChatStyleDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WeChatStyleDemo.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload WeChatStyleDemo-unsigned.zip
          mv WeChatStyleDemo-unsigned.zip WeChatStyleDemo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WeChatStyleDemo-IPA
          path: WeChatStyleDemo-unsigned.ipa
          retention-days: 7
