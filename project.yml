
name: WeChatStyleDemo

options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "17.0"

targets:
  WeChatStyleDemo:
    type: application
    platform: iOS
    sources:
      - path: WeChatStyleDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.WeChatStyleDemo
        PRODUCT_NAME: WeChatStyleDemo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
