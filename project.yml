
name: WeChatStyleDemo

options:
  bundleIdPrefix: com.demo

targets:
  WeChatStyleDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - WeChatStyleDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.WeChatStyleDemo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
